name: Deploy Static Website to S3 (OIDC)

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::839351545782:role/allowgithubactikonss3access
          aws-region: ap-south-1

      - name: Deploy static site to S3
        run: |
          aws s3 sync . s3://staticbucketeest92384923 \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --delete
